<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Rick & Morty App - Characters List</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@3.3.7/dist/css/bootstrap.min.css"
          integrity="sha384-BVYiiSIFeK1dGmJRAkycuHAHRg32OmUcww7on3RYdg4Va+PmSTsz/K68vbdEjh4u"
          crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@3.3.7/dist/css/bootstrap-theme.min.css"
          integrity="sha384-rHyoN1iRsVXV4nD0JutlnGaslCJuC7uwjduW9SVrLvRYooPp2bWYgmgJQIXwl/Sp"
          crossorigin="anonymous">
</head>
<body>
<div th:insert="~{menu::menu}"></div>

<a class="btn btn-primary btn-sm" th:href="@{|/characters/create|}">Crear personaje</a>

<div class="container" th:fragment="content">
    <h1>Characters</h1>
    <table class="table table-striped table-hover">
        <thead>
        <tr>
            <th>Name</th>
            <th>Status</th>
            <th>Species</th>
            <th>Action</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="c : ${characters}">
            <td th:text="${c.name}"></td>
            <td th:text="${c.status}"></td>
            <td th:text="${c.species}"></td>
            <td>
                <a class="btn btn-primary btn-sm" th:href="@{|/characters/${c.id}|}">Ver</a>
                <a class="btn btn-primary btn-sm" th:href="@{|/characters/edit/${c.id}|}">Editar</a>
                <form th:action="@{|/characters/delete/${c.id}|}" method="post">
                    <button type="submit" class="btn btn-danger btn-sm">
                        Borrar
                    </button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>
</div>
<div th:insert="~{plantilla::copy}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@3.3.7/dist/js/bootstrap.min.js"
        integrity="sha384-Tc5IQib027qvyjSMfHjOMaLkfuWVxZxUPnCJA7l2mCWNIpG9mGCD8wGNIcPD7Txa"
        crossorigin="anonymous"></script>
</body>
</html>
